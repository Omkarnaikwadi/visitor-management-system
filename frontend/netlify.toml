[build]
  command = "npm run build"
  publish = "dist"

# NOTE: Replace YOUR_RENDER_BACKEND_URL with your actual Render URL after deployment
# Example: https://vms-backend.onrender.com

[[redirects]]
  from = "/api/*"
  to = "https://YOUR_RENDER_BACKEND_URL.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
