services:
  - type: web
    name: vms-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: vms-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://your-app.netlify.app
      - key: BACKEND_URL
        value: https://your-backend.onrender.com
      - key: REDIS_ENABLED
        value: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        value: "+14155238886"

databases:
  - name: vms-db
    plan: free
